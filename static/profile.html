<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Complete Your Profile - UniDate</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-dark text-light">
  <div class="container d-flex flex-column justify-content-center align-items-center vh-100">
    <div class="card p-4 shadow-lg" style="min-width: 350px; max-width: 400px;">
      <h2 class="mb-3 text-center">Complete Your Profile</h2>
      <form id="profileForm">
        <div class="mb-3">
          <label for="profileName" class="form-label">Name</label>
          <input type="text" class="form-control" id="profileName" required>
        </div>
        <div class="mb-3">
          <label for="profileAge" class="form-label">Age</label>
          <select class="form-select" id="profileAge" required>
            <option value="">Select Age</option>
            <option value="18">18</option>
            <option value="19">19</option>
            <option value="20">20</option>
            <option value="21">21</option>
            <option value="22">22</option>
            <option value="23">23</option>
          </select>
        </div>
        <div class="mb-3">
          <label for="profileBranch" class="form-label">Branch</label>
          <select class="form-select" id="profileBranch" required></select>
        </div>
        <div class="mb-3">
          <label class="form-label">Batch</label>
          <input type="text" class="form-control" id="profileBatch" readonly>
        </div>
        <div id="profileError" class="alert alert-danger d-none" role="alert"></div>
        <div class="alert alert-warning">This information <b>cannot be changed later</b>. Please confirm before proceeding.</div>
        <button type="submit" class="btn btn-success w-100">Confirmed</button>
      </form>
    </div>
  </div>
  <script src="js/main.js"></script>
</body>
</html>
