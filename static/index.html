<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>UniDate - Login/Register</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-dark text-light">
  <div class="container d-flex flex-column justify-content-center align-items-center vh-100">
    <h1 class="mb-4 display-3 fw-bold text-gradient">UniDate</h1>
    <div class="card p-4 shadow-lg" style="min-width: 350px;">
      <button class="btn btn-outline-light mb-3 d-none" id="logoutBtnIndex">Logout</button>
      <div id="message" class="alert alert-info d-none" role="alert"></div>
      <ul class="nav nav-tabs mb-3" id="authTabs" role="tablist">
        <li class="nav-item" role="presentation">
          <button class="nav-link active" id="login-tab" data-bs-toggle="tab" data-bs-target="#login" type="button" role="tab">Login</button>
        </li>
        <li class="nav-item" role="presentation">
          <button class="nav-link" id="register-tab" data-bs-toggle="tab" data-bs-target="#register" type="button" role="tab">Register</button>
        </li>
      </ul>
      <div class="tab-content">
        <!-- Login Tab -->
        <div class="tab-pane fade show active" id="login" role="tabpanel">
          <form id="loginForm">
            <div class="mb-3">
              <input type="email" class="form-control" id="loginEmail" placeholder="BITS Email" required>
            </div>
            <div class="mb-3">
              <input type="text" class="form-control" id="loginOTP" placeholder="OTP" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Login</button>
            <button type="button" class="btn btn-outline-danger w-100 mt-2" id="googleLoginBtn">Sign in with Google</button>
          </form>
        </div>
        <!-- Register Tab -->
        <div class="tab-pane fade" id="register" role="tabpanel">
          <form id="registerForm">
            <div class="mb-3">
              <input type="email" class="form-control" id="registerEmail" placeholder="BITS Email" required>
            </div>
            <button type="submit" class="btn btn-success w-100">Send OTP</button>
            <button type="button" class="btn btn-outline-danger w-100 mt-2" id="googleRegisterBtn">Register with Google</button>
          </form>
        </div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
